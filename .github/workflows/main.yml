name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push backend
        run: |
          docker build -t us-central1-docker.pkg.dev/loyal-burner-493907-u6/todo-repo/backend:latest ./backend
          docker push us-central1-docker.pkg.dev/loyal-burner-493907-u6/todo-repo/backend:latest

      - name: Build and push frontend
        run: |
          docker build -t us-central1-docker.pkg.dev/loyal-burner-493907-u6/todo-repo/frontend:latest ./frontend
          docker push us-central1-docker.pkg.dev/loyal-burner-493907-u6/todo-repo/frontend:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy backend \
            --image=us-central1-docker.pkg.dev/loyal-burner-493907-u6/todo-repo/backend:latest \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy frontend \
            --image=us-central1-docker.pkg.dev/loyal-burner-493907-u6/todo-repo/frontend:latest \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated

      - name: Send Google Chat Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ Deployment successful! Frontend and Backend deployed to Cloud Run."
          else
            MSG="❌ Deployment failed! Check GitHub Actions logs."
          fi
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"$MSG\"}" \
            ${{ secrets.GCHAT_WEBHOOK_URL }}
